<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание занятий</title>
<!--
  Виджет расписания для сайта школы (Tilda и любой другой конструктор).
  Вставляется в блок «HTML-код» как <iframe src="https://ВАШ-ДОМЕН/raspisanie.html">.
  Данные берутся из CRM: /api/public/schedule — обновили расписание в CRM,
  на сайте оно обновилось само.

  По умолчанию показываются ВСЕ филиалы сразу — каждый своим блоком
  с названием и адресом, а сверху стоят кнопки: посетитель может открыть
  расписание только своего филиала.

  Параметры адреса:
    ?branch=<id филиала>  — жёстко один филиал (кнопок не будет)
    ?tabs=0               — убрать кнопки выбора филиала
    ?accent=%23dc2626     — свой акцентный цвет (# записывается как %23)
    ?theme=dark           — тёмная тема
    ?trainer=0            — не показывать имена тренеров
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ── Оформление ───────────────────────────────────────────────────────
     Фирменные цвета школы: красный / чёрный / белый. Серые слегка
     «подкрашены» в тёплый, чтобы не выглядеть мёртвыми рядом с красным.
     Заголовки — узкий гротеск Oswald (характер додзё), текст — системный
     шрифт: быстро грузится и одинаково читается на всех устройствах. */
  :root{
    --accent:#dc2626;
    --accent-soft:rgba(220,38,38,.10);
    --bg:#ffffff;
    --surface:#ffffff;
    --hair:#f0eeef;                     /* волосяная линия между занятиями */
    --ink:#111013;                      /* основной текст */
    --ink-2:#4b4a51;                    /* второстепенный */
    --muted:#8a8791;                    /* подписи */
    --chip:#f4f2f3;
    --chip-hover:#eceaec;
    --shadow:0 1px 1px rgba(17,16,19,.04), 0 10px 24px -12px rgba(17,16,19,.16);
    --radius:16px;
    --display:"Oswald","Arial Narrow",Impact,system-ui,sans-serif;
    --text:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0c0c0e; --surface:#161618; --hair:#262629;
    --ink:#f6f5f7; --ink-2:#c9c7cd; --muted:#8d8a93;
    --chip:#1f1f22; --chip-hover:#2a2a2e;
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--text); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px; margin:0 auto; padding:8px 20px 28px}

  /* ── Переключатель филиалов ───────────────────────────────────────── */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 24px}
  .tab{
    appearance:none; border:0; background:var(--chip); color:var(--ink-2);
    font-family:var(--text); font-size:.9rem; font-weight:600; line-height:1;
    padding:13px 18px; border-radius:999px; cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .tab:hover{background:var(--chip-hover); color:var(--ink)}
  .tab:active{transform:translateY(1px)}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .tab[aria-selected="true"]{background:var(--accent); color:#fff}

  /* ── Заголовок филиала ────────────────────────────────────────────── */
  .branch{display:flex; align-items:baseline; gap:14px; margin:40px 0 16px; flex-wrap:wrap}
  .branch:first-child{margin-top:4px}
  .branch h2{
    margin:0; font-family:var(--display); font-weight:600;
    font-size:1.5rem; line-height:1.1; letter-spacing:.02em; text-transform:uppercase;
    position:relative; padding-left:16px;
  }
  .branch h2::before{
    content:""; position:absolute; left:0; top:.1em; bottom:.1em;
    width:4px; border-radius:2px; background:var(--accent);
  }
  .branch p{margin:0; color:var(--muted); font-size:.875rem}
  #addr{margin:0 0 18px; color:var(--muted); font-size:.875rem}

  /* ── Сетка дней ───────────────────────────────────────────────────── */
  .grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .day{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; animation:rise .3s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .day{animation:none} }
  .day h3{
    margin:0; padding:16px 18px 10px;
    font-size:.6875rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:8px;
  }
  .day.today{box-shadow:var(--shadow), inset 0 3px 0 var(--accent)}
  .day.today h3{color:var(--accent); padding-top:19px}
  .today-tag{
    margin-left:auto; font-size:.625rem; letter-spacing:.08em;
    background:var(--accent-soft); color:var(--accent); padding:4px 9px; border-radius:999px;
  }

  ul{list-style:none; margin:0; padding:0 10px 10px}
  li{display:flex; gap:14px; align-items:baseline; padding:11px 8px}
  li + li{box-shadow:inset 0 1px 0 var(--hair)}
  .time{
    font-variant-numeric:tabular-nums; font-weight:700; font-size:.9375rem;
    color:var(--ink); letter-spacing:-.01em; white-space:nowrap; min-width:3.1em;
  }
  .info{min-width:0}
  .title{font-size:.9375rem; font-weight:600; line-height:1.3; color:var(--ink)}
  .meta{margin-top:3px; color:var(--muted); font-size:.8125rem; line-height:1.35}

  /* ── Пустое состояние и ошибка ────────────────────────────────────── */
  .note{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:30px 24px; text-align:center;
  }
  .note b{
    display:block; font-family:var(--display); font-size:1.125rem; font-weight:600;
    letter-spacing:.03em; text-transform:uppercase; margin-bottom:6px;
  }
  .note span{color:var(--muted); font-size:.9rem}

  @media (max-width:640px){
    .wrap{padding:8px 14px 22px}
    .branch{margin:32px 0 14px}
    .branch h2{font-size:1.3rem}
    .grid{gap:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="tabs" class="tabs" role="tablist" hidden></div>
  <p id="addr" hidden></p>
  <div id="out"></div>
</div>

<script>
(function () {
  var DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
  var p = new URLSearchParams(location.search);
  var fixedBranch = p.get("branch") || "";
  var showTrainer = p.get("trainer") !== "0";
  var useTabs = p.get("tabs") !== "0";           // кнопки выбора филиала
  if (p.get("accent")) document.documentElement.style.setProperty("--accent", p.get("accent"));
  if (p.get("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");

  var out = document.getElementById("out");
  var tabsEl = document.getElementById("tabs");
  var addrEl = document.getElementById("addr");
  var data = null, current = fixedBranch;

  // сообщаем высоту странице-родителю, чтобы iframe подстроился
  function sendHeight() {
    // именно высота содержимого: scrollHeight страницы не бывает меньше окна,
    // иначе iframe на сайте остался бы с пустым местом внизу
    var wrap = document.querySelector(".wrap");
    var h = Math.ceil(wrap ? wrap.getBoundingClientRect().bottom + 8 : document.documentElement.scrollHeight);
    try { parent.postMessage({ type: "karate-schedule-height", height: h }, "*"); } catch (e) {}
  }
  new ResizeObserver(sendHeight).observe(document.body);

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  var hhmm = function (t) { return String(t || "").slice(0, 5); };
  // понедельник = 0, как в CRM
  var todayIdx = (new Date().getDay() + 6) % 7;

  // Недельная сетка для набора занятий
  function weekHtml(list) {
    var html = '<div class="grid">';
    for (var d = 0; d < 7; d++) {
      var items = list.filter(function (s) { return s.day_of_week === d; });
      if (items.length === 0) continue;
      var today = d === todayIdx;
      html += '<div class="day' + (today ? " today" : "") + '"><h3>' + DAYS[d] +
        (today ? '<span class="today-tag">сегодня</span>' : "") + "</h3><ul>";
      items.forEach(function (s) {
        var meta = [];
        if (showTrainer && s.trainer_name) meta.push(esc(s.trainer_name));
        if (s.room) meta.push(esc(s.room));
        html += '<li><span class="time">' + hhmm(s.start_time) + "</span><div class=\"info\">" +
          '<div class="title">' + esc(s.title) + "</div>" +
          (meta.length ? '<div class="meta">' + meta.join(" · ") + "</div>" : "") +
          "</div></li>";
      });
      html += "</ul></div>";
    }
    return html + "</div>";
  }

  var EMPTY = '<div class="note"><b>Расписание скоро появится</b>' +
    "<span>Позвоните нам — подскажем ближайшую группу.</span></div>";

  function render() {
    // выбран конкретный филиал — показываем только его неделю
    if (current) {
      var list = data.sessions.filter(function (s) { return s.branch_id === current; });
      out.innerHTML = list.length ? weekHtml(list) : EMPTY;
      var b = data.branches.find(function (x) { return x.id === current; });
      addrEl.textContent = b && b.address ? b.address : "";
      addrEl.hidden = !addrEl.textContent;
      return sendHeight();
    }

    // по умолчанию: все филиалы сразу, каждый своим блоком
    addrEl.hidden = true;
    var html = "";
    data.branches.forEach(function (b) {
      var list = data.sessions.filter(function (s) { return s.branch_id === b.id; });
      if (list.length === 0) return;                      // пустые филиалы не показываем
      html += '<div class="branch"><h2>' + esc(b.name) + "</h2>" + addrHtml(b) + "</div>" + weekHtml(list);
    });
    // занятия без филиала — отдельным блоком в конце
    var noBranch = data.sessions.filter(function (s) { return !s.branch_id; });
    if (noBranch.length) html += '<div class="branch"><h2>Другие занятия</h2></div>' + weekHtml(noBranch);

    out.innerHTML = html || EMPTY;
    sendHeight();
  }

  function addrHtml(b) { return b.address ? "<p>" + esc(b.address) + "</p>" : ""; }

  function renderTabs() {
    var used = data.branches.filter(function (b) {
      return data.sessions.some(function (s) { return s.branch_id === b.id; });
    });
    if (fixedBranch || !useTabs || used.length < 2) return;
    // «Все филиалы» — вид по умолчанию, дальше кнопки по филиалам
    tabsEl.hidden = false;
    tabsEl.innerHTML = "";
    [{ id: "", name: "Все филиалы" }].concat(used).forEach(function (b) {
      var el = document.createElement("button");
      el.className = "tab"; el.type = "button"; el.textContent = b.name;
      el.setAttribute("role", "tab");
      el.setAttribute("aria-selected", String(b.id === current));
      el.onclick = function () {
        current = b.id;
        [].forEach.call(tabsEl.children, function (c) { c.setAttribute("aria-selected", String(c === el)); });
        render();
      };
      tabsEl.appendChild(el);
    });
  }

  fetch("/api/public/schedule")
    .then(function (r) { if (!r.ok) throw new Error("нет доступа"); return r.json(); })
    .then(function (d) { data = d; renderTabs(); render(); })
    .catch(function () {
      out.innerHTML = '<div class="note"><b>Расписание временно недоступно</b>' +
        "<span>Пожалуйста, позвоните нам — подскажем расписание.</span></div>";
      sendHeight();
    });
})();
</script>
</body>
</html>
